name: Nightly Food Data Sync

on:
  schedule:
    # 매일 한국 시간 새벽 04:37 (UTC 19:37) - 정각 부하 분산
    - cron: '37 19 * * *'
  workflow_dispatch:
    inputs:
      sample:
        description: '테스트용 샘플(10건)만 수집할지 여부'
        required: false
        type: boolean
        default: false

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Fetch and Compress Food Data
        env:
          FOOD_SAFETY_API_KEY: ${{ secrets.FOOD_SAFETY_API_KEY }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.sample }}" = "true" ]; then
            EXTRA_ARGS="--sample"
          fi
          python scripts/sync_data.py --output-dir ./dist_data $EXTRA_ARGS

      - name: Upload Data Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: data-latest
          name: Latest Food Data (Nightly Auto-Sync)
          body: |
            식품안전나라 I0030 건강기능식품 최신 데이터 정기 동기화 릴리즈입니다.
            - 갱신 주기: 매일 새벽 04:37 KST
            - 파일: `foods_latest.json.gz`, `version.json`
          files: |
            ./dist_data/foods_latest.json.gz
            ./dist_data/version.json
          draft: false
          prerelease: false

      - name: Deploy Data to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist_data
          destination_dir: data
          keep_files: true

      - name: Notify Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 [Nightly Sync 실패] ${new Date().toISOString().slice(0, 10)} 데이터 동기화 실패`,
              body: `야간 공공데이터 자동 수집 작업이 실패했습니다.\n\nActions 실행 로그를 확인하세요:\n${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
